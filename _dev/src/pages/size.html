<!--@ title="{{sz.title}}" desc="{{sz.desc}}" nav="sizes" body="p-size" -->
<section class="wrap szp">
  <div>
    <nav class="crumbs" aria-label="Breadcrumb">{{sz.crumbs}}</nav>
    <p class="eyebrow">{{i:layers}}{{sz.group}}</p>
    <h1 class="h2">{{sz.h1}}</h1>
    <p class="lead">{{sz.rule}}</p>
    <dl class="szp-facts">{{sz.facts}}</dl>
    <div class="cta-row">{{sz.cta}}</div>
  </div>
  <div class="svc-demo szp-art" data-banner="pilk" data-size="{{sz.id}}"{{sz.textattr}} aria-hidden="true"></div>
</section>
<section class="wrap szp-more">
  <div><h2>{{sz.hlay}}</h2><p>{{sz.lay}}</p></div>
  <div><h2>{{sz.hfiles}}</h2><p>{{sz.grp}}</p></div>
</section>
<section class="wrap szp-sib"><h2>{{sz.hsib}}</h2><ul class="szp-list">{{sz.sibs}}</ul><a class="link" href="sizes.html">{{sz.all}} {{i:arrow-right}}</a></section>
